# Include this file inside the API server's `location ~ \.php$` block.
fastcgi_cache barq_api;
fastcgi_cache_key "$scheme$request_method$host$request_uri";
fastcgi_cache_bypass $barq_skip_api_cache;
fastcgi_no_cache $barq_skip_api_cache;
fastcgi_cache_valid 200 10s;
fastcgi_cache_lock on;
fastcgi_cache_background_update on;
fastcgi_cache_use_stale updating error timeout invalid_header http_500 http_503;

# Laravel marks JSON private by default. The route allow-list above is the
# authority for this small cache; Set-Cookie is still honored and prevents a
# response from being stored.
fastcgi_ignore_headers Cache-Control Expires;

add_header X-Barq-Cache $upstream_cache_status always;
