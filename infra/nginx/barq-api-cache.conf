# Loaded inside nginx's http context via /etc/nginx/conf.d.
#
# Reference data is identical for every user and is safe to cache even when the
# mobile client sends an Authorization header. The ad feed is cacheable only
# for anonymous callers because signed-in users can have seller blocks and
# owner-specific fields.
fastcgi_cache_path /var/cache/nginx/barq-api
    levels=1:2
    keys_zone=barq_api:10m
    inactive=10m
    max_size=256m
    use_temp_path=off;

map $request_uri $barq_cache_route {
    default 0;

    ~^/api/v1/categories(?:\?.*)?$                 1;
    ~^/api/v1/regions(?:\?.*)?$                    1;
    ~^/api/v1/regions/[^/?]+/cities(?:\?.*)?$      1;
    ~^/api/v1/cities(?:\?.*)?$                     1;
    ~^/api/v1/cities/[0-9]+/districts(?:\?.*)?$    1;

    ~^/api/v1/ads(?:\?.*)?$                        2;
}

map "$request_method:$barq_cache_route" $barq_cache_candidate {
    default 0;
    ~^(GET|HEAD):1$ 1;
    ~^(GET|HEAD):2$ 2;
}

map "$barq_cache_candidate:$http_authorization" $barq_skip_api_cache {
    default 1;

    # Reference data is public and user-independent.
    ~^1: 0;

    # Feed responses are shared only when there is no Authorization header.
    "2:" 0;
}
