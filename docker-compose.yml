version: '3.9'

services:
  # ─── PostgreSQL 15 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: barq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barq_wadih}
      POSTGRES_USER: ${POSTGRES_USER:-barq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-***REMOVED***}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Bind to loopback only — never expose the DB to the internet.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - barq_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barq_user} -d ${POSTGRES_DB:-barq_wadih}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: barq_redis
    restart: unless-stopped
    ports:
      # Bind to loopback only — never expose Redis to the internet.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in the compose .env}
    volumes:
      - redis_data:/data
    networks:
      - barq_network
    command: ["sh", "-c", "redis-server --save 20 1 --loglevel warning --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Meilisearch ────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: barq_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-***REMOVED***}
      MEILI_ENV: development
    ports:
      # Bind to loopback only — never expose Meilisearch to the internet.
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - barq_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

# ─── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local

# ─── Network ────────────────────────────────────────────────────────────────
networks:
  barq_network:
    driver: bridge
